<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Convidados</title>
    <style>
        :root {
            --azul-bebe: #0a0b0e;
            --verde-bebe: #121318;
            --lilas-bebe: #1c110b;
            --lilas-escuro: #ff6a00;
            --texto-principal: #cfd2da;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--azul-bebe), var(--verde-bebe), var(--lilas-bebe));
            background-size: 300% 300%;
            animation: gradientAnim 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
            padding: 20px 0 40px 0;
            position: relative;
        }

        /* 1. FLASHES FREQUENTES TIPO TIROS / EXPLOSÕES */
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(circle at 15% 25%, rgba(255, 106, 0, 0.4) 0%, transparent 25%),
                radial-gradient(circle at 85% 75%, rgba(255, 255, 255, 0.3) 0%, transparent 20%);
            z-index: 1; pointer-events: none;
            animation: flashesTiro 4s infinite;
        }

        @keyframes flashesTiro {
            0%, 100% { opacity: 0; }
            5% { opacity: 0.8; filter: brightness(1.5); }
            8% { opacity: 0; }
            12% { opacity: 1; filter: brightness(2); }
            15% { opacity: 0.1; }
            45% { opacity: 0; }
            48% { opacity: 0.6; }
            50% { opacity: 0; }
            70% { opacity: 0.9; }
            75% { opacity: 0; }
        }

        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. FUMAÇA DE EXPLOSÃO DINÂMICA */
        .fumaça-bg {
            position: absolute; width: 150vw; height: 150vh; top: -25vh; left: -25vw;
            z-index: 2; pointer-events: none; opacity: 0.4;
            animation: fumaçaFlutuar 25s linear infinite alternate;
            mix-blend-mode: screen; 
        }
        
        @keyframes fumaçaFlutuar {
            0% { transform: scale(1) translate(0, 0) rotate(0deg); }
            100% { transform: scale(1.2) translate(-50px, -50px) rotate(5deg); }
        }

        .cartao-convite {
            background: rgba(18, 22, 28, 0.85); width: 90%; max-width: 420px; min-height: 600px;
            border-radius: 24px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 30px rgba(255,106,0,0.1);
            padding: 40px 25px; display: flex; flex-direction: column; align-items: center; text-align: center;
            z-index: 10; border: 1px solid rgba(255,106,0,0.25); opacity: 0;
            transform: scale(0.95) translateY(30px); animation: surgirCartao 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            backdrop-filter: blur(10px);
        }

        @keyframes surgirCartao { to { opacity: 1; transform: scale(1) translateY(0); } }

        .decoracao { position: absolute; z-index: 20; pointer-events: none; opacity: 0; animation: fadeDecoracao 1.5s ease forwards; filter: drop-shadow(0 0 8px var(--lilas-escuro)); }
        @keyframes fadeDecoracao { to { opacity: 0.6; } }

        .png-floral-topo { top: -10px; left: -10px; width: 120px; animation-delay: 0.5s; }
        .png-floral-base { bottom: -10px; right: -10px; width: 130px; animation-delay: 0.7s; }

        .animar-texto { opacity: 0; transform: translateY(15px); animation: subirTexto 0.8s ease forwards; }
        @keyframes subirTexto { to { opacity: 1; transform: translateY(0); } }
        .delay-1 { animation-delay: 0.8s; } .delay-2 { animation-delay: 1.1s; } .delay-3 { animation-delay: 1.4s; }

        .chamada { font-family: 'Montserrat', sans-serif; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; color: var(--lilas-escuro); margin: 40px 0 10px 0; z-index: 5; }
        .nome-bebe { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.8rem; text-transform: uppercase; color: #fff; letter-spacing: -1px; line-height: 1.2; margin-bottom: 25px; z-index: 5; text-shadow: 0 0 15px rgba(255,106,0,0.5); }

        .contador-bloco { 
            background: rgba(30, 41, 59, 0.4); 
            padding: 15px 20px; 
            border-radius: 12px; 
            width: 100%; 
            margin-bottom: 20px; 
            z-index: 5; 
            border: 1px solid rgba(255, 106, 0, 0.15);
            font-weight: 600;
            color: var(--texto-principal);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .contador-bloco span { color: var(--lilas-escuro); font-size: 1.5rem; font-weight: 900; display: block; margin-top: 5px;}

        /* Container Rolável da Lista de Nomes */
        .lista-container { width: 100%; max-height: 280px; overflow-y: auto; z-index: 5; margin-bottom: 20px; padding-right: 5px; }
        .lista-container::-webkit-scrollbar { width: 6px; }
        .lista-container::-webkit-scrollbar-thumb { background: rgba(255, 106, 0, 0.3); border-radius: 10px; }
        .lista-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }

        /* Item Individual de Convidado Tático */
        .convidado-item {
            background: rgba(30, 41, 59, 0.6);
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 8px;
            text-align: left;
            font-size: 0.85rem;
            color: #fff;
            border-left: 4px solid var(--lilas-escuro);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,106,0,0.1);
            border-right: 1px solid rgba(255,106,0,0.1);
            border-bottom: 1px solid rgba(255,106,0,0.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .convidado-data { font-size: 0.65rem; color: #a1a8b5; font-weight: 500; letter-spacing: 0.5px; }

        .btn-atualizar { background: linear-gradient(135deg, #ff6a00, #d95b00); color: white; border: none; padding: 12px 25px; font-family: 'Montserrat', sans-serif; font-weight: 700; border-radius: 30px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; box-shadow: 0 5px 20px rgba(255, 106, 0, 0.3); transition: all 0.3s; z-index: 5; width: auto; }
        .btn-atualizar:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <img src="./fumaca.png" class="fumaça-bg" alt="">

    <div class="cartao-convite">
        

        
        <div class="chamada animar-texto delay-1">Relatório</div>
        <h1 class="nome-bebe animar-texto delay-1">Convidados Confirmados</h1>

        <div class="contador-bloco animar-texto delay-2">
            QTD CONVIDADOS: <span id="totalContagem">0</span>
        </div>
        
        <div class="lista-container animar-texto delay-2" id="listaConvidados">
            <div style="color: #a1a8b5; font-size: 0.85rem; padding: 20px; text-transform: uppercase;">Acessando Banco de Dados...</div>
        </div>
        
        <button class="btn-atualizar animar-texto delay-3" onclick="obterLista()">Atualizar lista</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9NyBVa1Ha_42kwos09SV5VTN7NQWqHjM",
            authDomain: "tempero-da-casa-a2217.firebaseapp.com",
            projectId: "tempero-da-casa-a2217",
            storageBucket: "tempero-da-casa-a2217.firebasestorage.app",
            messagingSenderId: "92967322711",
            appId: "1:92967322711:web:88d151d9345f9191a8cf12"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const listaDiv = document.getElementById('listaConvidados');
        const totalSpan = document.getElementById('totalContagem');

        window.obterLista = async function() {
            listaDiv.innerHTML = '<div style="color: #a1a8b5; font-size: 0.85rem; padding: 20px; text-transform: uppercase;">Sincronizando...</div>';
            
            try {
                // Modificado para a coleção de aniversário do convite correspondente
                const q = query(collection(db, "presencas_aniversario"), orderBy("dataRegistro", "asc"));
                const querySnapshot = await getDocs(q);
                
                listaDiv.innerHTML = '';
                let total = 0;
                
                if (querySnapshot.empty) {
                    listaDiv.innerHTML = '<div style="color: #a1a8b5; font-size: 0.85rem; padding: 20px; text-transform: uppercase;">Nenhum convidado confirmado.</div>';
                    totalSpan.innerText = '0';
                    return;
                }
                
                querySnapshot.forEach((doc) => {
                    total++;
                    const dados = doc.data();
                    const nome = dados.nome;
                    
                    let dataFormatada = "";
                    if (dados.dataRegistro) {
                        const dataObjeto = dados.dataRegistro.toDate();
                        dataFormatada = dataObjeto.toLocaleDateString('pt-BR', {
                            day: '2-digit', 
                            month: '2-digit', 
                            hour: '2-digit', 
                            minute: '2-digit'
                        });
                    }

                    const item = document.createElement('div');
                    item.className = 'convidado-item';
                    item.innerHTML = `
                        <span><strong>${total}.</strong> ${nome}</span>
                        <span class="convidado-data">${dataFormatada}</span>
                    `;
                    listaDiv.appendChild(item);
                });
                
                totalSpan.innerText = total;
            } catch (error) {
                console.error("Erro ao ler dados:", error);
                listaDiv.innerHTML = '<div style="color: #ff6a00; font-size: 0.85rem; padding: 20px; text-transform: uppercase;">Falha na conexão de rede. Verifique os logs.</div>';
            }
        }

        // Executa automaticamente quando a página abre
        document.addEventListener('DOMContentLoaded', window.obterLista);
    </script>
</body>
</html>
